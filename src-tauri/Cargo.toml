[package]
name = "bangumi-timetable-app"
version = "0.1.0"
description = "像课表一样追番的 Windows、macOS 与 Android 客户端"
authors = ["Bangumi ClassTimetable contributors"]
edition = "2021"

[lib]
name = "bangumi_timetable_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
